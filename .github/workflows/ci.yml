name: Terraform CI
on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: terraform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  terraform:
    name: Terraform root
    uses: MikeeeGit/terraform-delivery-templates/.github/workflows/terraform-validate.yml@281d779aced9c6e7da082b5e57c85639dc1858df
    with:
      template-ref: 281d779aced9c6e7da082b5e57c85639dc1858df
      directory: .
      test-directory: tests
  examples:
    name: Example (${{ matrix.directory }})
    strategy:
      fail-fast: false
      matrix:
        directory:
          - examples/basic
          - examples/hub-spoke
    uses: MikeeeGit/terraform-delivery-templates/.github/workflows/terraform-validate.yml@281d779aced9c6e7da082b5e57c85639dc1858df
    with:
      template-ref: 281d779aced9c6e7da082b5e57c85639dc1858df
      directory: ${{ matrix.directory }}
      test-directory: ${{ matrix.directory == 'examples/hub-spoke' && 'tests' || '' }}
