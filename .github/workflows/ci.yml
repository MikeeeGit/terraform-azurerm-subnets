name: Terraform CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: terraform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  terraform:
    name: Terraform root
    uses: MikeeeGit/terraform-delivery-templates/.github/workflows/terraform-validate.yml@50ba5619ce143b9d142790691bc13e13c3ef809a
    with:
      template-ref: 50ba5619ce143b9d142790691bc13e13c3ef809a
      directory: .
      test-directory: tests
  examples:
    name: Example (${{ matrix.directory }})
    strategy:
      fail-fast: false
      matrix:
        directory:
          - examples/basic
    uses: MikeeeGit/terraform-delivery-templates/.github/workflows/terraform-validate.yml@50ba5619ce143b9d142790691bc13e13c3ef809a
    with:
      template-ref: 50ba5619ce143b9d142790691bc13e13c3ef809a
      directory: ${{ matrix.directory }}
